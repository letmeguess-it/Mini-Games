<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Mini Games logo: a looping question mark in the ten game colours, orbited by ten dots (one per game). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2a35"/><stop offset="1" stop-color="#121117"/></linearGradient>
    <linearGradient id="ribbon" x1="20" y1="14" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c6ef5"/><stop offset=".18" stop-color="#15aabf"/><stop offset=".36" stop-color="#40c057"/>
      <stop offset=".52" stop-color="#fcc419"/><stop offset=".68" stop-color="#ff922b"/><stop offset=".84" stop-color="#e64980"/><stop offset="1" stop-color="#7950f2"/>
    </linearGradient>
    <radialGradient id="dot" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e5dbff"/><stop offset="1" stop-color="#7950f2"/></radialGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <rect width="96" height="96" rx="24" fill="url(#glow)"/>
  <!-- orbit of ten game dots -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5" stroke-dasharray="2 4"/>
  <g>
    <circle cx="48" cy="10" r="3" fill="#3b5bdb"/><circle cx="70.3" cy="17.3" r="3" fill="#0c8599"/><circle cx="84.1" cy="36.3" r="3" fill="#e8590c"/>
    <circle cx="84.1" cy="59.7" r="3" fill="#7048e8"/><circle cx="70.3" cy="78.7" r="3" fill="#1098ad"/><circle cx="48" cy="86" r="3" fill="#2f9e44"/>
    <circle cx="25.7" cy="78.7" r="3" fill="#c2255c"/><circle cx="11.9" cy="59.7" r="3" fill="#a07800"/><circle cx="11.9" cy="36.3" r="3" fill="#d6336c"/><circle cx="25.7" cy="17.3" r="3" fill="#5f3dc4"/>
  </g>
  <!-- the loopy question mark: shadow, ribbon, highlight -->
  <path d="M30 35C30 23 39 16 49 16C60 16 67 24 66 32C65 40 57 42 51 45C45 48 42 55 47 60C52 65 61 61 61 54C61 48 54 46 50 50C47 53 47 57 47 60"
        fill="none" stroke="#000" stroke-opacity=".35" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5 2.5)"/>
  <path d="M30 35C30 23 39 16 49 16C60 16 67 24 66 32C65 40 57 42 51 45C45 48 42 55 47 60C52 65 61 61 61 54C61 48 54 46 50 50C47 53 47 57 47 60"
        fill="none" stroke="url(#ribbon)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33.5 31C35 24 41 20 48 20" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="47.5" cy="75" r="5.8" fill="url(#dot)"/><circle cx="45.7" cy="73.2" r="1.8" fill="#fff" fill-opacity=".8"/>
</svg>
